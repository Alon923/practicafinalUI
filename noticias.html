<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noticias · the netgame</title>
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/responsive.css" />
</head>
<body>
  <header class="site-header">
    <div class="topbar container">
      <a class="brand" href="index.html">the netgame <span>•</span></a>
      <p class="brand-note">News, reviews, and<br />hardware for the next<br />frame.</p>
      <div class="header-actions">
        <button aria-label="Buscar">⌕</button>
        <a href="#">Mi cuenta</a>
        <span>⚙</span>
      </div>
    </div>

    <nav class="main-nav container" aria-label="Navegación principal">
      <a href="index.html">Home</a>
      <a class="active" href="noticias.html">News</a>
      <a href="#">Reviews</a>
      <a href="#">Hardware</a>
      <a href="#">Guides</a>
      <a href="#">Community</a>
      <a class="saved" href="#">♧ &nbsp; Noticias guardadas</a>
    </nav>
  </header>

  <main class="container section-grid">
    <div id="article-not-found" hidden>
      <p class="section-label">ARTÍCULO NO ENCONTRADO</p>
      <h1>Esta noticia no existe o ya no está disponible.</h1>
      <a class="more-link" href="index.html">Volver al inicio&nbsp; →</a>
    </div>

    <article id="article-content" class="article-page">
      <p class="section-label" id="article-category"></p>
      <h1 id="article-page-title"></h1>
      <p class="article-summary" id="article-summary"></p>
      <div class="article-meta">
        <span id="article-author"></span>
        <span id="article-reading-time"></span>
        <time id="article-date"></time>
      </div>
      <div class="article-image image-frame">
        <img id="article-image" src="" alt="" />
      </div>
      <div class="article-body" id="article-body"></div>
    </article>

    <section class="related-section">
      <div class="section-heading"><h2>Más noticias</h2></div>
      <div class="card-grid" id="related-articles"></div>
    </section>
  </main>
  <script src="scripts/articles.js"></script>
  <script src="scripts/article.js"></script>
</body>
</html>
